<script>
(function(){
  document.querySelectorAll('table.sortable').forEach(function(t){
    var sortDir = {};
    t.querySelectorAll('thead th').forEach(function(th, idx){
      th.style.cursor = 'pointer';
      th.title = 'click to sort';
      th.addEventListener('click', function(){
        var dir = sortDir[idx] = (sortDir[idx] === 'asc' ? 'desc' : 'asc');
        var tbody = t.tBodies[0];
        var rows = Array.from(tbody.rows);
        var num = th.classList.contains('num');
        rows.sort(function(a, b){
          var av = a.cells[idx] ? a.cells[idx].innerText.trim() : '';
          var bv = b.cells[idx] ? b.cells[idx].innerText.trim() : '';
          if (num) {
            var an = parseFloat(av.replace(/[^0-9.\-]/g,'')) || 0;
            var bn = parseFloat(bv.replace(/[^0-9.\-]/g,'')) || 0;
            return dir==='asc' ? an-bn : bn-an;
          }
          return dir==='asc' ? av.localeCompare(bv) : bv.localeCompare(av);
        });
        rows.forEach(function(r){ tbody.appendChild(r); });
        t.querySelectorAll('thead th').forEach(function(x){ x.classList.remove('sort-asc','sort-desc'); });
        th.classList.add(dir === 'asc' ? 'sort-asc' : 'sort-desc');
      });
    });
  });
})();
</script>

</body></html>
